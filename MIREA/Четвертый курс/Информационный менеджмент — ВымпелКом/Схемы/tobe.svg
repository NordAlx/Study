<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#333" stroke-width="1.3"/></marker></defs><rect width="1200" height="870" fill="white"/><text x="600" y="35.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">Каталог, регламент, договорные правила и права доступа</text><polyline points="60,80 1150,80" fill="none" stroke="#333" stroke-width="2"/><rect x="40" y="165" width="255" height="115" rx="0" fill="#f4f5f6" stroke="#333" stroke-width="2"/><text x="167.5" y="191.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">A1 (B1)</text><text x="167.5" y="222.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">Зарегистрировать</text><text x="167.5" y="253.70000000000002" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">единую заявку</text><polyline points="167,80 167,165" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="167,780 167,280" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="295,222 315,222 315,367 325,367" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><rect x="231.94" y="265.3" width="136.12" height="29.4" fill="white"/><text x="300" y="280.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="21" font-weight="400" fill="#111">Потребность</text><rect x="325" y="310" width="255" height="115" rx="0" fill="#f4f5f6" stroke="#333" stroke-width="2"/><text x="452.5" y="338.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="24" font-weight="400" fill="#111">A2 (B2)</text><text x="452.5" y="367.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="24" font-weight="400" fill="#111">Сформировать</text><text x="452.5" y="396.29999999999995" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="24" font-weight="400" fill="#111">версию предложения</text><polyline points="452,80 452,310" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="452,780 452,425" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="580,367 600,367 600,512 610,512" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><rect x="516.94" y="410.3" width="136.12" height="29.4" fill="white"/><text x="585" y="425.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="21" font-weight="400" fill="#111">Предложение</text><rect x="610" y="455" width="255" height="115" rx="0" fill="#f4f5f6" stroke="#333" stroke-width="2"/><text x="737.5" y="481.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">A3 (B3)</text><text x="737.5" y="512.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">Согласовать и</text><text x="737.5" y="543.7" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">оформить договор</text><polyline points="737,80 737,455" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="737,780 737,570" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="865,512 885,512 885,657 895,657" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><rect x="823.78" y="555.3" width="92.44" height="29.4" fill="white"/><text x="870" y="570.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="21" font-weight="400" fill="#111">Договор</text><rect x="895" y="600" width="255" height="115" rx="0" fill="#f4f5f6" stroke="#333" stroke-width="2"/><text x="1022.5" y="626.3" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">A4 (B4)</text><text x="1022.5" y="657.5" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">Подключить и</text><text x="1022.5" y="688.6999999999999" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="26" font-weight="400" fill="#111">передать клиента</text><polyline points="1022,80 1022,600" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="1022,780 1022,715" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><polyline points="1150,780 60,780" fill="none" stroke="#333" stroke-width="2"/><polyline points="2,222 40,222" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><rect x="1.8000000000000007" y="178.0" width="26.4" height="28.0" fill="white"/><text x="15" y="192.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="20" font-weight="400" fill="#111">I</text><polyline points="1150,657 1195,657" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"/><rect x="1163.8" y="611.0" width="26.4" height="28.0" fill="white"/><text x="1177" y="625.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="20" font-weight="400" fill="#111">O</text><text x="600" y="830.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="25" font-weight="400" fill="#111">Механизмы — участники и проектируемая ИС с адаптерами</text><text x="600" y="120.0" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="23" font-weight="400" fill="#111">Декомпозиция контекстного блока; возвраты на д